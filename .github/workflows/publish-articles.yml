# Rebuilds and deploys the site to Cloudflare Pages on the mornings an article
# is due (src/lib/articles-data.ts), so scheduled articles go live on their date.
# Run it by hand from the Actions tab to deploy the current main at any time.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit)
# and WEB3FORMS_KEY (the forms' access key, the same value as in .env.local).
name: Publish scheduled articles

on:
  schedule:
    - cron: '5 3 * * *' # 06:05 Qatar time, every day
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: f6bd91973721474a5cabadcbaeb0bc6e
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  NEXT_PUBLIC_SITE_URL: https://nasrallahtrading.com
  NEXT_PUBLIC_SANITY_PROJECT_ID: dfj16ucm
  NEXT_PUBLIC_SANITY_DATASET: production
  NEXT_PUBLIC_SANITY_API_VERSION: '2025-10-01'
  NEXT_PUBLIC_ENABLE_HCAPTCHA: 'false'
  NEXT_PUBLIC_WEB3FORMS_CONTACT_KEY: ${{ secrets.WEB3FORMS_KEY }}
  NEXT_PUBLIC_WEB3FORMS_QUOTE_KEY: ${{ secrets.WEB3FORMS_KEY }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is an article due today?
        id: due
        run: |
          today=$(TZ=Asia/Qatar date +%F)
          if grep -q "date: '$today'" src/lib/articles-data.ts; then echo "due=true" >> "$GITHUB_OUTPUT"; fi
          echo "Qatar date: $today"

      - if: steps.due.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - if: steps.due.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - if: steps.due.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: (steps.due.outputs.due == 'true' || github.event_name == 'workflow_dispatch') && env.CLOUDFLARE_API_TOKEN != '' && env.NEXT_PUBLIC_WEB3FORMS_CONTACT_KEY != ''
        run: npx --yes wrangler@4.157.0 pages deploy out --project-name=nasrallah-website --branch=main --commit-message="Scheduled build $(TZ=Asia/Qatar date +%F)"

      - name: Tell Bing about today's article (IndexNow)
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: node scripts/indexnow.mjs

      - name: Warn when a secret is missing
        if: env.CLOUDFLARE_API_TOKEN == '' || env.NEXT_PUBLIC_WEB3FORMS_CONTACT_KEY == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN or WEB3FORMS_KEY is not set, so nothing was deployed."
